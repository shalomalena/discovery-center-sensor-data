name: Update Sensor CSV

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python update_sensor.py

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add live_sensor_10543_all.csv
          git commit -m "Update sensor CSV" || echo "No changes"
          git push
